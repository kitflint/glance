<!doctype html>
<!-- KitFlint Glance: the project page now lives at kitflint.com/glance/. Self-contained: no scripts, external assets or trackers. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KitFlint Glance</title>
  <meta name="description" content="KitFlint Glance has moved to kitflint.com/glance/: a free, local-first project board with optional GitHub issue sync and local MCP.">
  <link rel="canonical" href="https://kitflint.com/glance/">
  <meta http-equiv="refresh" content="0; url=https://kitflint.com/glance/">
  <meta name="robots" content="noindex, follow">
  <style>
    :root { --bg: #fafafa; --fg: #171717; --muted: #525252; --line: #e5e5e5; --accent: #171717; --accent-fg: #ffffff; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #111111; --fg: #f2f2f2; --muted: #b0b0b0; --line: #2c2c2c; --accent: #f2f2f2; --accent-fg: #111111; }
    }
    :root[data-theme="dark"] { --bg: #111111; --fg: #f2f2f2; --muted: #b0b0b0; --line: #2c2c2c; --accent: #f2f2f2; --accent-fg: #111111; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 72px 16px; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.15; margin: 0 0 12px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .cta { display: flex; flex-wrap: wrap; gap: 12px; }
    a.btn { display: inline-block; padding: 12px 18px; border-radius: 8px; border: 1px solid var(--accent); color: var(--fg); text-decoration: none; font-weight: 700; }
    a.btn.primary { background: var(--accent); color: var(--accent-fg); }
  </style>
</head>
<body>
  <main>
    <h1>KitFlint Glance has moved</h1>
    <p>The Glance page, with setup screenshots, MCP connection snippets and instructions for AI agents, is now at kitflint.com/glance/.</p>
    <div class="cta">
      <a class="btn primary" href="https://kitflint.com/glance/">Go to kitflint.com/glance</a>
      <a class="btn" href="https://github.com/kitflint/glance">Source on GitHub</a>
    </div>
  </main>
</body>
</html>
