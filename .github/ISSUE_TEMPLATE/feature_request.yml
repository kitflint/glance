name: Feature request
description: Describe a workflow Glance could support better.
body:
  - type: markdown
    attributes:
      value: |
        Keep tokens, private launch links, board or repository data and vulnerability details out of public issues.
        Use synthetic examples and review any logs before posting.
  - type: input
    id: versions
    attributes:
      label: Versions and environment
      description: Include Glance, Node.js and Windows versions, plus browser or local MCP client versions if relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Current workflow with synthetic data
      description: Describe what you do today and how to see the gap with a synthetic example.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or messages
      description: Optional. Paste only relevant excerpts with credentials, private paths and board data removed.
